[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gantry-ledger"
version = "2.0.2"
description = "Versioned robot design and decision ledger"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Gantry contributors"}]

[project.urls]
Repository = "https://github.com/fourn9/gantry-oss"
Issues = "https://github.com/fourn9/gantry-oss/issues"

[project.optional-dependencies]
feedback = ["PyNaCl>=1.6.2,<2"]

[project.scripts]
gantry = "gantry.cli:main"

[tool.setuptools.packages.find]
include = ["gantry*"]

[tool.setuptools.package-data]
gantry = ["web/*.html", "web/*.css", "web/*.js"]
